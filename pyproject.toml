[project]
name = "plato-classification-features"
version = "0.1.0"
description = "A simple library to compute features from single-band astronomical time series"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=7.2.0",
    "fitsio>=1.3.0",
    "holoviews>=1.22.1",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "nifty-ls>=1.1.0",
    "numpy>=2.3.5",
    "panel>=1.8.7",
    "polars>=1.37.1",
    "pyarrow>=23.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "tqdm>=4.67.2",
    "umap-learn>=0.5.11",
    "xgboost-cpu>=3.2.0",
]

